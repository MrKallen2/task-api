services:
  db:
    image: postgres:16
    container_name: app_postgres_db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: java-api-container
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/app
      DB_USER: postgres
      DB_PASSWORD: "1234"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

networks:
  app_net:

volumes:
  db_data:
